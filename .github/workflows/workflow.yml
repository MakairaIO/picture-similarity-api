name: workflow.yml
on:
  push:
    branches:
      - stable
  pull_request:

jobs:
  tests:
    name: Run CI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'true'

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          command: install
          php_version: 8.5
          php_extensions: sqlite3 pdo_sqlite
          version: 2
          args: --ignore-platform-reqs --prefer-dist -no

      - name: Run tests
        uses: php-actions/phpunit@v4

  release:
    name: Release
    needs: tests
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'true'

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          command: install
          dev: no
          php_version: 8.5
          version: 2
          args: --ignore-platform-reqs --prefer-dist -no

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Semantic release
        run: |
          npx --package semantic-release \
             --package @semantic-release/changelog \
             --package @semantic-release/exec \
             --package @semantic-release/git \
             --package @semantic-release/github \
             --package @semantic-release/npm \
             semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_USERNAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_USERNAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_EMAIL }}

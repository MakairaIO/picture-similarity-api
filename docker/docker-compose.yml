version: '3.7'

networks:
  proxy:
    external: true

volumes:
  db: ~

services:
  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    volumes:
      - '../:/app'
      - '/etc/passwd:/etc/passwd:ro'
      - '/etc/group:/etc/group:ro'
    working_dir: '/app'
    networks:
      proxy:
      default:
    labels:
      - traefik.port=80
      - traefik.frontend.rule=Host:${HOST:-picture-similarity.docker.localhost}
      - traefik.frontend.passHostHeader=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
    user: "${USER_UID:-www-data}:${USER_GID:-www-data}"
    environment:
      APP_DATA: /app/var
      WEB_PORT: 80
      WEB_ROOT: /app/public
      PHP_OPCACHE_INI: 1
      PHPINI_UPLOAD_MAX_FILESIZE: 100M
      PHPINI_POST_MAX_SIZE: 100M
      PHP_ZEND_EXTENSIONS: "xdebug.so"
      PHPINI_XDEBUG__DISCOVER_CLIENT_HOST: "false"
      PHPINI_XDEBUG__CLIENT_HOST: host.docker.internal
      PHPINI_XDEBUG__CLIENT_PORT: 9000
      PHPINI_XDEBUG__START_WITH_REQUEST: "trigger"
      PHPINI_XDEBUG__TRIGGER_VALUE: ""
      PHPINI_XDEBUG__MODE: "debug,develop"
      PHPINI_XDEBUG__CLI_COLOR: "1"
      PHPINI_XDEBUG__MAX_NESTING_LEVEL: 512
      PHPINI_XDEBUG__VAR_DISPLAY_MAX_CHILDREN: 256
      PHPINI_XDEBUG__VAR_DISPLAY_MAX_DATA: 1024
      PHPINI_XDEBUG__VAR_DISPLAY_MAX_DEPTH: 10
      PHP_IDE_CONFIG: serverName=${HOST:-picture-similarity.docker.localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mysql:5.7
    volumes:
      - "db:/var/lib/mysql/"
      - "./db/dump/:/docker-entrypoint-initdb.d/:ro"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "33067:3306"
